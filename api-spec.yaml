components:
  schemas:
    OrganizationInput:
      required:
      - description
      - name
      type: object
      properties:
        name:
          maxLength: 120
          minLength: 1
          type: string
          example: KTU Faculty of Informatics
          description: Negali būti tuščia arba vien tarpai.
        description:
          maxLength: 2000
          minLength: 0
          type: string
          example: A collaboration space for students
      additionalProperties: false
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        errors:
          type: array
          description: Laukų validacijos klaidos (422).
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
    Organization:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
    NoteInput:
      required:
      - category
      - content
      - groupId
      - title
      type: object
      properties:
        title:
          maxLength: 200
          minLength: 1
          type: string
          example: HTTP methods
          description: Negali būti tuščia arba vien tarpai.
        content:
          maxLength: 20000
          minLength: 1
          type: string
          example: GET reads, POST creates, PUT replaces, DELETE removes.
          description: Negali būti tuščia arba vien tarpai.
        category:
          maxLength: 100
          minLength: 1
          type: string
          example: REST
          description: Negali būti tuščia arba vien tarpai.
        groupId:
          minimum: 1
          type: integer
          format: int64
          example: 1
      additionalProperties: false
    Note:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        content:
          type: string
        category:
          type: string
        groupId:
          type: integer
          format: int64
    GroupInput:
      required:
      - description
      - name
      type: object
      properties:
        name:
          maxLength: 120
          minLength: 1
          type: string
          example: Web Technologies
          description: Negali būti tuščia arba vien tarpai.
        description:
          maxLength: 2000
          minLength: 0
          type: string
          example: Course notes and laboratory assignments
        organizationId:
          minimum: 1
          type: integer
          description: Organization ID, or null for a standalone group
          format: int64
          nullable: true
          example: 1
      additionalProperties: false
    Group:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        organizationId:
          type: integer
          format: int64
          nullable: true
    Credentials:
      required:
      - password
      - username
      type: object
      properties:
        username:
          pattern: ^[A-Za-z0-9_.-]{3,80}$
          type: string
          minLength: 3
          maxLength: 80
          description: Registruojant normalizuojamas į mažąsias raides.
        password:
          maxLength: 72
          minLength: 12
          type: string
          format: password
          writeOnly: true
          description: Bent 12 simbolių; ne daugiau kaip 72 UTF-8 baitai.
      additionalProperties: false
    RefreshRequest:
      type: object
      required: [refreshToken]
      additionalProperties: false
      properties:
        refreshToken:
          type: string
          minLength: 1
          maxLength: 128
    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
        refreshToken:
          type: string
        refreshExpiresAt:
          type: integer
          format: int64
          description: Absolute refresh expiry in Unix milliseconds; rotation does not extend it
        expiresIn:
          type: integer
          format: int64
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
