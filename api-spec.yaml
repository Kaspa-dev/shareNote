openapi: 3.0.1
info:
  title: ShareNote API
  version: 1.0.0
  description: 19 operacijų, įskaitant hierarchinius išteklių kelius. USER, EDITOR ir ADMIN gali skaityti; ADMIN valdo visus
    išteklius, EDITOR kuria užrašus ir keičia bei trina tik savo pagal JWT sub ir ownerId. Visi prisijungę naudotojai mato
    bendrą biblioteką. Pavyzdžių ID ir žetonai iliustraciniai. Sąrašams galima perduoti page ir size; praleidus abu grąžinamas
    visas sąrašas. Klaidos pateikiamos application/problem+json; netikėti serverio sutrikimai gali sukelti 5xx. Jei Accept
    neleidžia klaidos formato, 406 atsakymo kūnas gali skirtis.
servers:
- url: http://localhost:8080
  description: Vietinis API
- url: http://localhost:3000
  description: Vietinis frontend tarpinis serveris
security:
- bearerAuth: []
paths:
  /api/organizations/{id}:
    get:
      tags:
      - Organizations
      summary: Get organization by ID
      operationId: getOrganization
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        '200':
          description: Resource found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
              example:
                id: 1
                name: Universitetas
                description: Bendra studijų erdvė.
                _links:
                  self:
                    href: /api/organizations/1
                  collection:
                    href: /api/organizations
                  groups:
                    href: /api/organizations/1/groups
        '400':
          description: Netaisyklingas JSON, nežinomas laukas arba netinkamas tipas.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Bad Request
                status: 400
                detail: Failed to read request
        '401':
          description: Trūksta galiojančio JWT arba neteisingi prisijungimo duomenys.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: A valid Bearer token is required.
          headers:
            WWW-Authenticate:
              schema:
                type: string
              example: Bearer
        '403':
          description: Vaidmuo neleidžia operacijos.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Forbidden
                status: 403
                detail: Your role does not allow this operation.
        '404':
          description: Išteklius arba susijęs išteklius nerastas.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: Organization (id=999) was not found.
        '406':
          description: Accept prašo nepalaikomo formato.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Not Acceptable
                status: 406
                detail: No acceptable representation
      description: |-
        Leidžiama USER, EDITOR ir ADMIN.

        Užklausos pavyzdys:
        ```http
        GET /api/organizations/1 HTTP/1.1
        Host: localhost:8080
        Accept: application/json, application/problem+json
        Authorization: Bearer <JWT>
        ```

        Atsakymo pavyzdys:
        ```http
        HTTP/1.1 200 OK
        Content-Type: application/json

        {
          "id": 1,
          "name": "Universitetas",
          "description": "Bendra studijų erdvė.",
          "_links": {
            "self": {
              "href": "/api/organizations/1"
            },
            "collection": {
              "href": "/api/organizations"
            },
            "groups": {
              "href": "/api/organizations/1/groups"
            }
          }
        }
        ```
    put:
      tags:
      - Organizations
      summary: Replace organization
      description: |-
        Leidžiama tik ADMIN. PUT pakeičia visus redaguojamus laukus; nesamo ištekliaus nesukuria.

        Užklausos pavyzdys:
        ```http
        PUT /api/organizations/1 HTTP/1.1
        Host: localhost:8080
        Accept: application/json, application/problem+json
        Authorization: Bearer <JWT>
        Content-Type: application/json

        {
          "name": "Universitetas (atnaujinta)",
          "description": "Bendra studijų erdvė."
        }
        ```

        Atsakymo pavyzdys:
        ```http
        HTTP/1.1 200 OK
        Content-Type: application/json

        {
          "id": 1,
          "name": "Universitetas (atnaujinta)",
          "description": "Bendra studijų erdvė.",
          "_links": {
            "self": {
              "href": "/api/organizations/1"
            },
            "collection": {
              "href": "/api/organizations"
            },
            "groups": {
              "href": "/api/organizations/1/groups"
            }
          }
        }
        ```
      operationId: updateOrganization
