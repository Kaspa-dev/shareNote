  /api/auth/register:
    post:
      tags:
      - Authentication
      summary: Register a USER and receive a JWT
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
            example:
              username: studentas
              password: Pavyzdinis-123!
        required: true
      responses:
        '201':
          description: Registered; JWT contains the USER role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                accessToken: <gautas-JWT>
                tokenType: Bearer
                expiresIn: 180
                refreshToken: <gautas-refresh-JWT>
                refreshExpiresAt: 1793275200000
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
        '400':
          description: Netaisyklingas JSON, nežinomas laukas arba netinkamas tipas.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Bad Request
                status: 400
                detail: Failed to read request
        '401':
          description: Trūksta galiojančio JWT arba neteisingi prisijungimo duomenys.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: A valid Bearer token is required.
        '406':
          description: Accept prašo nepalaikomo formato.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Not Acceptable
                status: 406
                detail: No acceptable representation
        '409':
          description: Užimtas naudotojo vardas arba DB ryšių konfliktas.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Conflict
                status: 409
                detail: Username is already registered.
        '415':
          description: Content-Type turi būti application/json.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Unsupported Media Type
                status: 415
                detail: Content-Type 'text/plain' is not supported.
        '422':
          description: Laukai neatitinka validacijos reikalavimų.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
