      operationId: createOrganization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationInput'
            example:
              name: Universitetas
              description: Bendra studijų erdvė.
        required: true
      responses:
        '201':
          description: Resource created; Location contains its URL
          headers:
            Location:
              description: Sukurto ištekliaus santykinis URL.
              schema:
                type: string
                format: uri-reference
              example: /api/organizations/1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
              example:
                id: 1
                name: Universitetas
                description: Bendra studijų erdvė.
                _links:
                  self:
                    href: /api/organizations/1
                  collection:
