                status: 422
                detail: Payload field values do not meet the validation requirements.
                errors:
                - field: password
                  message: must not be blank
      security: []
      description: |-
        Vieša operacija. Pateikus netinkamą Bearer žetoną, saugos filtras gali grąžinti 401.

        Užklausos pavyzdys:
        ```http
        POST /api/auth/register HTTP/1.1
        Host: localhost:8080
        Accept: application/json, application/problem+json
        Content-Type: application/json

        {
          "username": "studentas",
          "password": "Pavyzdinis-123!"
        }
        ```

        Atsakymo pavyzdys:
        ```http
        HTTP/1.1 201 Created
        Cache-Control: no-store
        Content-Type: application/json

        {
          "accessToken": "<gautas-JWT>",
          "tokenType": "Bearer",
          "expiresIn": 180,
          "refreshToken": "<gautas-refresh-JWT>",
          "refreshExpiresAt": 1793275200000
        }
        ```
  /api/auth/refresh:
    post:
      tags:
      - Authentication
      summary: Rotate a refresh token and issue a new access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refreshToken: <gautas-refresh-JWT>
      responses:
        '200':
          description: New token pair; the previous refresh token is consumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                accessToken: <gautas-JWT>
                tokenType: Bearer
                expiresIn: 180
                refreshToken: <gautas-refresh-JWT>
                refreshExpiresAt: 1793275200000
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
        '401':
          description: Trūksta galiojančio JWT arba neteisingi prisijungimo duomenys.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: Invalid or expired refresh token.
        '422':
          description: Laukai neatitinka validacijos reikalavimų.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Unprocessable Entity
                status: 422
                detail: Payload field values do not meet the validation requirements.
                errors:
                - field: refreshToken
                  message: must not be blank
        '400':
          description: Netaisyklingas JSON, nežinomas laukas arba netinkamas tipas.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Bad Request
                status: 400
                detail: Failed to read request
        '415':
          description: Content-Type turi būti application/json.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Unsupported Media Type
                status: 415
                detail: Content-Type 'text/plain' is not supported.
