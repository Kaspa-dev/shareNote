      description: |-
        Scoped to the parent in the URL. Missing parents or children belonging to another parent return 404. ADMIN can write all notes; EDITOR can create and write only their own notes. The server assigns ownerId from JWT sub.

        Užklausos pavyzdys:
        ```http
        DELETE /api/organizations/1/groups/1/notes/1 HTTP/1.1
        Host: localhost:8080
        Accept: application/json, application/problem+json
        Authorization: Bearer <JWT>
        ```

        Atsakymo pavyzdys:
        ```http
        HTTP/1.1 204 No Content
        ```
        Atsakymo kūnas tuščias.
components:
  schemas:
    OrganizationInput:
      required:
      - description
      - name
      type: object
      properties:
        name:
          maxLength: 120
          minLength: 1
          type: string
          example: KTU Faculty of Informatics
          description: Negali būti tuščia arba vien tarpai.
        description:
          maxLength: 2000
          minLength: 0
          type: string
          example: A collaboration space for students
      additionalProperties: false
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        errors:
          type: array
          description: Laukų validacijos klaidos (422).
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
    ResourceLink:
      type: object
      required:
      - href
      properties:
        href:
          type: string
          format: uri-reference
          example: /api/organizations/1
    Organization:
      type: object
      properties:
        _links:
          type: object
          readOnly: true
          description: Navigation relations with same-origin API hrefs; see docs/hypermedia.md.
          additionalProperties:
            $ref: '#/components/schemas/ResourceLink'
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
      required:
      - _links
      - id
      - name
      - description
    Note:
      type: object
      description: A composite resource built from the note and its parent group for note details.
      properties:
        group:
          $ref: '#/components/schemas/Group'
        _links:
          type: object
          readOnly: true
          description: Navigation relations with same-origin API hrefs; see docs/hypermedia.md.
          additionalProperties:
            $ref: '#/components/schemas/ResourceLink'
        id:
          type: integer
          format: int64
        title:
          type: string
        content:
          type: string
        category:
          type: string
        ownerId:
          type: integer
          format: int64
          readOnly: true
          nullable: true
          description: Author user ID from JWT sub; null for historical shared notes.
        priority:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
        groupId:
          type: integer
          format: int64
      required:
      - group
      - _links
      - id
      - title
      - content
      - category
      - ownerId
      - priority
      - groupId
    Group:
      type: object
      properties:
        _links:
          type: object
          readOnly: true
          description: Navigation relations with same-origin API hrefs; see docs/hypermedia.md.
          additionalProperties:
            $ref: '#/components/schemas/ResourceLink'
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        organizationId:
          type: integer
          format: int64
          description: Required organization ID
      required:
      - _links
      - id
      - name
      - description
      - organizationId
    Credentials:
      required:
      - password
      - username
      type: object
      properties:
        username:
          pattern: ^[A-Za-z0-9_.-]{3,80}$
          type: string
          minLength: 3
          maxLength: 80
          description: Registruojant normalizuojamas į mažąsias raides.
        password:
          maxLength: 72
          minLength: 12
          type: string
          format: password
          writeOnly: true
          description: Bent 12 simbolių; ne daugiau kaip 72 UTF-8 baitai.
      additionalProperties: false
    RefreshRequest:
      type: object
      required:
      - refreshToken
      additionalProperties: false
      properties:
        refreshToken:
          type: string
          minLength: 1
          maxLength: 4096
    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
        refreshToken:
          type: string
        refreshExpiresAt:
          type: integer
          format: int64
          description: Absolute refresh expiry in Unix milliseconds; rotation does not extend it
        expiresIn:
          type: integer
          format: int64
          description: Prieigos JWT galiojimas sekundėmis (180).
      required:
      - accessToken
      - tokenType
      - refreshToken
      - refreshExpiresAt
      - expiresIn
    NestedGroupInput:
      required:
      - description
      - name
      type: object
      properties:
        name:
          maxLength: 120
          minLength: 1
          type: string
          example: Web Technologies
          description: Negali būti tuščia arba vien tarpai.
        description:
          maxLength: 2000
          minLength: 0
          type: string
          example: Course notes and laboratory assignments
      additionalProperties: false
      description: The parent is supplied by the URL; do not include organizationId in the body.
    NestedNoteInput:
      required:
      - category
      - content
      - title
      type: object
      properties:
        priority:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - null
          default: MEDIUM
          description: Praleidus arba pateikus null naudojama MEDIUM.
          nullable: true
        title:
          maxLength: 200
          minLength: 1
          type: string
          example: HTTP methods
          description: Negali būti tuščia arba vien tarpai.
        content:
          maxLength: 20000
          minLength: 1
          type: string
          example: GET reads, POST creates, PUT replaces, DELETE removes.
          description: Negali būti tuščia arba vien tarpai.
        category:
          maxLength: 100
          minLength: 1
          type: string
          example: REST
          description: Negali būti tuščia arba vien tarpai.
      additionalProperties: false
      description: The parent is supplied by the URL; do not include groupId in the body.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
