      description: |-
        Leidžiama tik ADMIN.

        Užklausos pavyzdys:
        ```http
        DELETE /api/organizations/1 HTTP/1.1
        Host: localhost:8080
        Accept: application/json, application/problem+json
        Authorization: Bearer <JWT>
        ```

        Atsakymo pavyzdys:
        ```http
        HTTP/1.1 204 No Content
        ```
        Atsakymo kūnas tuščias.
  /api/organizations:
    get:
      tags:
      - Organizations
      summary: List organizations
      operationId: listOrganizations
      parameters:
      - name: page
        in: query
        required: false
        description: Puslapis nuo 0; numatyta 0, jei pateiktas tik size.
        schema:
          type: integer
          format: int32
          minimum: 0
        example: 0
      - name: size
        in: query
        required: false
        description: Puslapio dydis 1–100; numatyta 10, jei pateiktas tik page.
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        example: 10
      responses:
        '200':
          description: List ordered by ID; may be empty
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organization'
              example:
              - id: 1
                name: Universitetas
                description: Bendra studijų erdvė.
                _links:
                  self:
                    href: /api/organizations/1
                  collection:
                    href: /api/organizations
                  groups:
                    href: /api/organizations/1/groups
        '400':
          description: Netaisyklingas JSON, nežinomas laukas arba netinkamas tipas.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Bad Request
                status: 400
                detail: Failed to read request
        '401':
          description: Trūksta galiojančio JWT arba neteisingi prisijungimo duomenys.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: A valid Bearer token is required.
          headers:
            WWW-Authenticate:
              schema:
                type: string
              example: Bearer
        '403':
          description: Vaidmuo neleidžia operacijos.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Forbidden
                status: 403
                detail: Your role does not allow this operation.
        '406':
          description: Accept prašo nepalaikomo formato.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Not Acceptable
                status: 406
                detail: No acceptable representation
      description: |-
        Leidžiama USER, EDITOR ir ADMIN. Neprivalomi page ir size įjungia puslapiavimą (numatyta 0 ir 10). Praleidus abu grąžinamas visas sąrašas; atsakymas lieka JSON masyvas.

        Užklausos pavyzdys:
        ```http
        GET /api/organizations?page=0&size=10 HTTP/1.1
        Host: localhost:8080
        Accept: application/json, application/problem+json
        Authorization: Bearer <JWT>
        ```

        Atsakymo pavyzdys:
        ```http
        HTTP/1.1 200 OK
        Content-Type: application/json

        [
          {
            "id": 1,
            "name": "Universitetas",
            "description": "Bendra studijų erdvė.",
            "_links": {
              "self": {
                "href": "/api/organizations/1"
              },
              "collection": {
                "href": "/api/organizations"
              },
              "groups": {
                "href": "/api/organizations/1/groups"
              }
            }
          }
        ]
        ```
    post:
