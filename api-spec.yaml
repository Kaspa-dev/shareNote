                title: Not Acceptable
                status: 406
                detail: No acceptable representation
        '409':
          description: Užimtas naudotojo vardas arba DB ryšių konfliktas.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Conflict
                status: 409
                detail: This operation would violate resource relationships. Delete dependent resources first.
        '415':
          description: Content-Type turi būti application/json.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Unsupported Media Type
                status: 415
                detail: Content-Type 'text/plain' is not supported.
        '422':
          description: Laukai neatitinka validacijos reikalavimų.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: about:blank
                title: Unprocessable Entity
                status: 422
                detail: Payload field values do not meet the validation requirements.
                errors:
                - field: name
                  message: must not be blank
    delete:
      tags:
      - Organizations
      summary: Delete organization
      operationId: deleteOrganization
      parameters:
