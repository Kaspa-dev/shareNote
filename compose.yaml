services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sharenote
      POSTGRES_USER: sharenote
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sharenote-local}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sharenote -d sharenote"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/sharenote
      DB_USER: sharenote
      DB_PASSWORD: ${DB_PASSWORD:-sharenote-local}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres-data:
