services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sharenote
      POSTGRES_USER: sharenote
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sharenote-local}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sharenote -d sharenote"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
