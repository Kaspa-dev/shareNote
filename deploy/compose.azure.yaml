name: sharenote

services:
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 128m
    depends_on:
      - frontend
  frontend:
    build: ../frontend
    restart: unless-stopped
    mem_limit: 64m
    depends_on:
      - api
  api:
    build: ../backend
    restart: unless-stopped
    mem_limit: 768m
    environment:
      DB_URL: jdbc:postgresql://db:5432/sharenote
      DB_USER: sharenote
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx384m
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_DB: sharenote
      POSTGRES_USER: sharenote
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sharenote -d sharenote"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
